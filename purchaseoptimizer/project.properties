# -----------------------------------------------------------------------------
# B2B Purchase Pattern Optimizer
# Override any value in local.properties / env / CCv2 secrets.
# -----------------------------------------------------------------------------
purchaseoptimizer.application-context=purchaseoptimizer-spring.xml

# ---- Feature flags -----------------------------------------------------------
purchaseoptimizer.enabled=true
# OpenAI explanations. Needs a key: either open_ai_api_key in OpenAiClient.java or the property below.
purchaseoptimizer.ai.enabled=false

# ---- History / hygiene -------------------------------------------------------
purchaseoptimizer.history.months=12
purchaseoptimizer.open.lookback.days=120
# Order status codes counted as completed purchase history
purchaseoptimizer.status.completed=COMPLETED
# Order status codes treated as open POs (ordered, not yet completed)
purchaseoptimizer.status.open=CREATED,ON_VALIDATION,PENDING_APPROVAL,PENDING_APPROVAL_FROM_MERCHANT,APPROVED,APPROVED_BY_MERCHANT,PROCESSING
purchaseoptimizer.scheme.weight=0.5

# ---- Replenishment -----------------------------------------------------------
purchaseoptimizer.min.orders=3
purchaseoptimizer.due.min=0.85
purchaseoptimizer.due.max=1.30
purchaseoptimizer.due.drop.above=5.0

# ---- Quantity ----------------------------------------------------------------
purchaseoptimizer.qty.median.weight=0.6
purchaseoptimizer.qty.ewma.weight=0.4
purchaseoptimizer.qty.trend.min=0.85
purchaseoptimizer.qty.trend.max=1.15
purchaseoptimizer.qty.p90.cap.factor=1.25

# ---- Scoring (must sum to 1.0) ----------------------------------------------
purchaseoptimizer.score.due=0.45
purchaseoptimizer.score.mix=0.20
purchaseoptimizer.score.affinity=0.20
purchaseoptimizer.score.recency=0.15

# ---- Product-reference (affinity gap) candidates ----------------------------
purchaseoptimizer.affinity.enabled=true
purchaseoptimizer.affinity.min.source.orders=3
purchaseoptimizer.affinity.max.lines=3

# ---- Automatic budget profile -----------------------------------------------
purchaseoptimizer.budget.min.orders=3
purchaseoptimizer.budget.high.min.orders=8
# k-th highest order value in window = HIGH tier (allowed 4 or 5)
purchaseoptimizer.budget.high.k=4
purchaseoptimizer.budget.granularity=100
purchaseoptimizer.max.lines=25
# Max lines when no budget profile can be derived (fewer than budget.min.orders orders)
purchaseoptimizer.max.lines.exploratory=10
purchaseoptimizer.diminishing.factor=0.8

# ---- OpenAI ------------------------------------------------------------------
purchaseoptimizer.ai.openai.endpoint=https://api.openai.com/v1/chat/completions
purchaseoptimizer.ai.openai.model=gpt-4o-mini
purchaseoptimizer.ai.openai.apikey=
purchaseoptimizer.ai.timeout.ms=8000
purchaseoptimizer.ai.max.tokens=900
purchaseoptimizer.ai.explanation.maxlength=240
# Simple circuit breaker: after N consecutive failures stay in template mode for cooldown seconds
purchaseoptimizer.ai.breaker.failures=3
purchaseoptimizer.ai.breaker.cooldown.seconds=300
# Per-dealer calls per minute
purchaseoptimizer.ai.ratelimit.per.minute=5

# ---- Business configuration (push products) ---------------------------------
# Fallbacks used when no active OptimizerConfig item exists. Normal tuning is done in Backoffice.
purchaseoptimizer.strategy.enabled=true
purchaseoptimizer.config.boost.cap=0.15
purchaseoptimizer.config.strategic.line.cap=0.25
purchaseoptimizer.config.strategic.value.cap=0.30
purchaseoptimizer.config.gate.min.category.orders=1
purchaseoptimizer.config.cache.seconds=60
# Hard ceiling for StrategicPriority.boost (validated on save)
purchaseoptimizer.boost.hard.max=0.5
# Bundle base relevance before boost
purchaseoptimizer.bundle.base.relevance=0.30
purchaseoptimizer.strategy.max.category.products=200
# Holdout: HMAC-SHA256 key (set via env/secrets, never commit). keyId is written to every audit record.
purchaseoptimizer.holdout.hmac.secret=
purchaseoptimizer.holdout.hmac.key.id=k1
# Only members of this user group may move a campaign/priority/bundle to APPROVED
purchaseoptimizer.approver.group=campaignapprover
